<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-file-bookmark</title>
<style>
  :root {
    --bg: #14110f;
    --surface: #1f1b17;
    --card: #1f1b17;
    --border: #3a332a;
    --border-h: #524838;
    --text: #e8dcc8;
    --text-dim: #8a7e6b;
    --accent: #f59e0b;
    --accent-h: #fbbf24;
    --green: #84cc16;
    --red: #f87171;
    --radius: 8px;
    --gap: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(245,158,11,.06), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(132,204,22,.04), transparent 45%);
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--accent);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 22px;
    background: var(--accent);
    border-radius: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: var(--gap);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    transition: border-color .2s;
  }
  .card:hover { border-color: var(--border-h); }
  .card h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .subtitle {
    font-size: .75rem;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .fg { margin-bottom: 10px; }
  .fg label {
    display: block;
    font-size: .75rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .fg input, .fg select {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text);
    font-size: .82rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .fg input:focus, .fg select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(245,158,11,.2);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .btn {
    padding: 7px 14px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: transparent;
    color: var(--accent);
    font-size: .8rem;
    cursor: pointer;
    font-weight: 500;
    font-family: inherit;
    transition: background .15s, color .15s, transform .1s;
  }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-h); border-color: var(--accent-h); }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: var(--bg); }
  .btn-s { padding: 4px 9px; font-size: .72rem; }
  .list {
    flex: 1;
    overflow-y: auto;
    max-height: 280px;
    margin-top: 10px;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    background: var(--bg);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .item:hover { border-color: var(--accent); background: rgba(245,158,11,.06); }
  .item .info { flex: 1; min-width: 0; }
  .item .name {
    font-size: .82rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item .alias {
    font-size: .7rem;
    color: var(--accent);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-top: 2px;
  }
  .no-alias { color: #5c5346; }
  .item .path {
    font-size: .66rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-top: 1px;
  }
  .item .acts { display: flex; gap: 4px; margin-left: 10px; flex-shrink: 0; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: .6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .badge-file { background: rgba(245,158,11,.15); color: var(--accent); }
  .badge-folder { background: rgba(132,204,22,.15); color: var(--green); }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 20px;
    font-size: .8rem;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: .82rem;
    font-weight: 500;
    z-index: 9999;
    animation: slideIn .3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    max-width: 320px;
  }
  .toast-ok { background: #1a2e0a; color: var(--green); border: 1px solid var(--green); }
  .toast-err { background: #2e1414; color: var(--red); border: 1px solid var(--red); }
  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .mt10 { margin-top: 10px; }
  .path-row { display: flex; gap: 6px; align-items: stretch; }
  .path-row input { flex: 1; }
  .path-row .btn { white-space: nowrap; flex-shrink: 0; }
  .hidden { display: none !important; }
  .results {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 10px;
    font-size: .72rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .results .line { padding: 3px 0; border-bottom: 1px solid var(--border); }
  .results .line:last-child { border-bottom: none; }
</style>
</head>
<body>

<h1>📁 文件收藏 &amp; 项目创建助手</h1>

<div class="grid">

  <!-- 卡片 1：添加收藏 -->
  <div class="card" id="card-add">
    <h2>🔖 添加收藏</h2>
    <p class="subtitle">收藏常用的文件或文件夹，通过别名快速访问</p>
    <div class="fg">
      <label for="add-path">文件 / 文件夹路径</label>
      <input type="text" id="add-path" placeholder="C:\Users\me\project 或 /home/me/project">
    </div>
    <div class="row">
      <div class="fg">
        <label for="add-alias">别名（可选）</label>
        <input type="text" id="add-alias" placeholder="我的项目">
      </div>
      <div class="fg">
        <label for="add-type">类型</label>
        <select id="add-type">
          <option value="file">文件</option>
          <option value="folder">文件夹</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" id="add-btn">➕ 添加收藏</button>
    <div class="list mt10" id="bookmark-list"></div>
  </div>

  <!-- 卡片 2：打开收藏 -->
  <div class="card" id="card-open">
    <h2>🚀 打开收藏</h2>
    <p class="subtitle">点击任一收藏项，在文件管理器中打开</p>
    <div class="list" id="open-list"></div>
  </div>

  <!-- 卡片 3：创建项目 -->
  <div class="card" id="card-project">
    <h2>🚀 创建项目</h2>
    <p class="subtitle">选择项目类型，一键创建标准工程结构</p>
    <div class="fg">
      <label for="project-base">目标目录</label>
      <div class="path-row">
        <input type="text" id="project-base" placeholder="C:\projects 或 /home/me/projects">
        <button class="btn btn-s" id="select-folder-btn" type="button">📂 选择文件夹</button>
      </div>
    </div>
    <div class="fg">
      <label for="project-name">项目名称</label>
      <input type="text" id="project-name" placeholder="my-project">
    </div>
    <div class="fg">
      <label for="project-type">项目类型</label>
      <select id="project-type">
        <optgroup label="基础"><option value="empty">空白文件夹</option></optgroup>
        <optgroup label="项目管理"><option value="project-management">项目管理工程</option></optgroup>
        <optgroup label="代码类工程">
          <option value="code-java">Java 工程</option>
          <option value="code-python">Python 工程</option>
          <option value="code-vue">Vue 工程（npm 创建）</option>
          <option value="code-dsh-plugin">DSH Plugin 工程</option>
        </optgroup>
        <optgroup label="知识类工程"><option value="knowledge">知识类工程</option></optgroup>
        <optgroup label="探索类工程"><option value="exploration">探索类工程</option></optgroup>
        <optgroup label="复制类工程"><option value="copy">复制类工程</option></optgroup>
      </select>
    </div>
    <div class="fg hidden" id="source-wrap">
      <label for="source-path">源工程路径</label>
      <div class="path-row">
        <input type="text" id="source-path" placeholder="C:\projects\source-project">
        <button class="btn btn-s" id="select-source-btn" type="button">📂 选择</button>
      </div>
    </div>
    <button class="btn btn-primary" id="create-project-btn" type="button">🚀 创建项目</button>
    <div class="list mt10" id="project-results"></div>
  </div>

</div>

<script>
const API = '/api'

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => {
    switch (c) {
      case '&': return '&amp;'
      case '<': return '&lt;'
      case '>': return '&gt;'
      case '"': return '&quot;'
      case "'": return '&#39;'
      default: return c
    }
  })
}

function toast(msg, ok = true) {
  const el = document.createElement('div')
  el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err')
  el.setAttribute('role', ok ? 'status' : 'alert')
  el.setAttribute('aria-live', 'polite')
  el.textContent = msg
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 2800)
}

function bookmarkItemHtml(b) {
  const name = b.path.split(/[/\\]/).pop() || b.path
  const alias = b.alias ? escapeHtml(b.alias) : '<span class="no-alias">无别名</span>'
  return `<div class="item" data-action="open" data-alias="${escapeHtml(b.alias)}" title="点击打开: ${escapeHtml(b.path)}">
    <div class="info">
      <div class="name"><span class="badge badge-${b.type}">${b.type}</span> ${escapeHtml(name)}</div>
      <div class="alias">🏷 ${alias}</div>
      <div class="path">${escapeHtml(b.path)}</div>
    </div>
    <div class="acts">
      <button class="btn btn-s btn-primary" data-action="open" data-alias="${escapeHtml(b.alias)}">打开</button>
      <button class="btn btn-s btn-danger" data-action="remove" data-alias="${escapeHtml(b.alias)}" aria-label="删除书签">✕</button>
    </div>
  </div>`
}

function renderBookmarkList(bookmarks) {
  const container = document.getElementById('bookmark-list')
  if (!bookmarks || bookmarks.length === 0) {
    container.innerHTML = '<div class="empty">还没有收藏项，在上方添加第一个</div>'
    return
  }
  container.innerHTML = bookmarks.map(bookmarkItemHtml).join('')
}

function renderOpenList(bookmarks) {
  const container = document.getElementById('open-list')
  if (!bookmarks || bookmarks.length === 0) {
    container.innerHTML = '<div class="empty">还没有收藏项，去"添加收藏"卡片添加</div>'
    return
  }
  container.innerHTML = bookmarks.map(bookmarkItemHtml).join('')
}

// ── API helpers ──
async function apiGet(path) {
  const res = await fetch(API + path)
  if (!res.ok) throw new Error('HTTP ' + res.status)
  return res.json()
}
async function apiPost(path, body) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  if (!res.ok) throw new Error('HTTP ' + res.status)
  return res.json()
}
async function apiDelete(path) {
  const res = await fetch(API + path, { method: 'DELETE' })
  if (!res.ok) throw new Error('HTTP ' + res.status)
  return res.json()
}

async function refreshAll() {
  try {
    const data = await apiGet('/bookmarks')
    renderBookmarkList(data)
    renderOpenList(data)
  } catch (e) {
    console.error('刷新书签列表失败:', e)
  }
}

// ── 卡片 1：添加收藏 ──
document.getElementById('add-btn').addEventListener('click', async () => {
  const path = document.getElementById('add-path').value.trim()
  const alias = document.getElementById('add-alias').value.trim()
  const type = document.getElementById('add-type').value
  if (!path) { toast('请输入路径', false); return }

  const btn = document.getElementById('add-btn')
  btn.disabled = true
  btn.textContent = '⏳ 添加中...'
  try {
    const data = await apiPost('/bookmarks', { path, alias: alias || undefined, type })
    if (data.success) {
      toast(data.message)
      document.getElementById('add-path').value = ''
      document.getElementById('add-alias').value = ''
    } else {
      toast(data.message, false)
    }
    await refreshAll()
  } catch (e) {
    toast('请求失败: ' + e.message, false)
  } finally {
    btn.disabled = false
    btn.textContent = '➕ 添加收藏'
  }
})

// ── 卡片 2：打开收藏 (event delegation) ──
async function openBookmark(alias) {
  try {
    const data = await apiPost('/open', { target: alias })
    toast(data.message, data.success)
  } catch (e) { toast('打开失败: ' + e.message, false) }
}

async function removeBookmark(alias) {
  try {
    const data = await apiDelete('/bookmarks/' + encodeURIComponent(alias))
    toast(data.message, data.success)
    await refreshAll()
  } catch (e) { toast('删除失败: ' + e.message, false) }
}

document.getElementById('bookmark-list').addEventListener('click', onListClick)
document.getElementById('open-list').addEventListener('click', onListClick)

function onListClick(e) {
  const el = e.target.closest('[data-action]')
  if (!el) return
  const action = el.dataset.action
  const alias = el.dataset.alias
  if (!alias) return
  e.stopPropagation()
  if (action === 'open') openBookmark(alias)
  else if (action === 'remove') removeBookmark(alias)
}

// ── 卡片 3：创建项目 ──
document.getElementById('select-folder-btn').addEventListener('click', () => selectFolder('project-base'))
document.getElementById('select-source-btn').addEventListener('click', () => selectFolder('source-path'))
document.getElementById('project-type').addEventListener('change', () => {
  const type = document.getElementById('project-type').value
  document.getElementById('source-wrap').classList.toggle('hidden', type !== 'copy')
})
document.getElementById('create-project-btn').addEventListener('click', createProject)

async function selectFolder(targetInputId) {
  try {
    const data = await apiGet('/select-folder')
    if (data.success && data.path) {
      document.getElementById(targetInputId).value = data.path
      toast(data.message)
    } else {
      toast(data.message, false)
    }
  } catch (e) { toast('选择文件夹失败: ' + e.message, false) }
}

async function createProject() {
  const basePath = document.getElementById('project-base').value.trim()
  const projectName = document.getElementById('project-name').value.trim()
  const projectType = document.getElementById('project-type').value
  const sourcePath = document.getElementById('source-path').value.trim()

  if (!basePath) { toast('请选择或输入目标目录', false); return }
  if (!projectName) { toast('请输入项目名称', false); return }
  if (projectType === 'copy' && !sourcePath) { toast('请输入源工程路径', false); return }

  const btn = document.getElementById('create-project-btn')
  btn.disabled = true
  btn.textContent = '⏳ 创建中...'

  try {
    const data = await apiPost('/create-project', {
      basePath,
      projectName,
      projectType,
      sourcePath: projectType === 'copy' ? sourcePath : undefined,
    })
    toast(data.message, data.success)
    renderProjectResults(data)
  } catch (e) {
    toast('创建项目失败: ' + e.message, false)
  } finally {
    btn.disabled = false
    btn.textContent = '🚀 创建项目'
  }
}

function renderProjectResults(result) {
  const container = document.getElementById('project-results')
  if (!result.success) {
    container.innerHTML = `<div class="item">
      <div class="info">
        <div class="name">❌ 创建失败</div>
        <div class="path">${escapeHtml(result.message)}</div>
      </div>
    </div>`
    return
  }
  const detailsHtml = (result.details || []).map(d =>
    `<div class="line">${escapeHtml(d)}</div>`
  ).join('')
  const name = result.projectPath.split(/[/\\]/).pop() || result.projectPath
  container.innerHTML = `<div class="item">
      <div class="info">
        <div class="name">✅ ${escapeHtml(name)}</div>
        <div class="path">${escapeHtml(result.projectPath)}</div>
      </div>
      <span class="badge badge-folder">project</span>
    </div>
    <div class="results">${detailsHtml}</div>`
}

// initial load
refreshAll()
</script>
</body>
</html>

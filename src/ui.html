<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-file-bookmark</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--dsw-bg, #ffffff);
    --surface: var(--dsw-bg-inset, #f6f8fa);
    --card: var(--dsw-bg-elevated, #ffffff);
    --border: var(--dsw-border, #d0d7de);
    --border-h: var(--dsw-border-strong, #0969da);
    --text: var(--dsw-text-primary, #1f2328);
    --text-dim: var(--dsw-text-secondary, #656d76);
    --accent: var(--dsw-alias-brand-primary, #f59e0b);
    --accent-h: var(--dsw-alias-brand-primary, #d97706);
    --green: #1a7f37;
    --red: var(--dsw-alias-state-error-primary, #cf222e);
    --radius: 8px;
    --gap: 14px;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--dsw-bg, #14110f);
      --surface: var(--dsw-bg-inset, #1f1b17);
      --card: var(--dsw-bg-elevated, #1f1b17);
      --border: var(--dsw-border, #3a332a);
      --border-h: var(--dsw-border-strong, #524838);
      --text: var(--dsw-text-primary, #e8dcc8);
      --text-dim: var(--dsw-text-secondary, #8a7e6b);
      --accent: var(--dsw-alias-brand-primary, #f59e0b);
      --accent-h: var(--dsw-alias-brand-primary, #fbbf24);
      --green: #84cc16;
      --red: var(--dsw-alias-state-error-primary, #f87171);
      --shadow: none;
    }
  }
  html[data-theme="dark"] {
    --bg: var(--dsw-bg, #14110f);
    --surface: var(--dsw-bg-inset, #1f1b17);
    --card: var(--dsw-bg-elevated, #1f1b17);
    --border: var(--dsw-border, #3a332a);
    --border-h: var(--dsw-border-strong, #524838);
    --text: var(--dsw-text-primary, #e8dcc8);
    --text-dim: var(--dsw-text-secondary, #8a7e6b);
    --accent: var(--dsw-alias-brand-primary, #f59e0b);
    --accent-h: var(--dsw-alias-brand-primary, #fbbf24);
    --green: #84cc16;
    --red: var(--dsw-alias-state-error-primary, #f87171);
    --shadow: none;
  }
  html[data-theme="light"] {
    --bg: var(--dsw-bg, #ffffff);
    --surface: var(--dsw-bg-inset, #f6f8fa);
    --card: var(--dsw-bg-elevated, #ffffff);
    --border: var(--dsw-border, #d0d7de);
    --border-h: var(--dsw-border-strong, #0969da);
    --text: var(--dsw-text-primary, #1f2328);
    --text-dim: var(--dsw-text-secondary, #656d76);
    --accent: var(--dsw-alias-brand-primary, #d97706);
    --accent-h: var(--dsw-alias-brand-primary, #b45309);
    --green: #1a7f37;
    --red: var(--dsw-alias-state-error-primary, #cf222e);
    --shadow: none;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    transition: border-color .2s;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }
  .card:hover { border-color: var(--border-h); }
  .card h2 {
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .card .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .fg { margin-bottom: 10px; min-width: 0; }
  .fg label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .fg input, .fg select {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--dsw-alias-bg-module-platform, var(--surface));
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    color-scheme: light dark;
    outline: none;
    transition: border-color .15s;
  }
  .fg input:focus, .fg select:focus {
    border-color: var(--border-h);
  }
  .row { display: flex; gap: 14px; min-width: 0; }
  .row > * { flex: 1; min-width: 0; }
  .btn {
    font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--dsw-bg-elevated, rgba(128,128,128,.08)); color: inherit;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--dsw-hover, rgba(128,128,128,.18)); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--dsw-alias-button-primary-fill, var(--accent)); border-color: transparent; color: var(--dsw-alias-label-primary-foreground, #fff); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  .btn-danger:hover { background: rgba(229,72,77,.12); }
  .btn-s { padding: 4px 9px; font-size: .72rem; }
  .add-form {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-width: 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 0;
    padding-bottom: 8px;
  }
  .sort-bar span {
    font-size: .7rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .sort-bar button {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    font-size: .68rem;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .sort-bar button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .sort-bar button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .list {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    margin-top: 10px;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 6px;
    background: var(--card);
    cursor: pointer;
    transition: border-color .15s;
  }
  .item:hover { border-color: var(--border-h); }
  .item .info { flex: 1; min-width: 0; }
  .item .name {
    font-size: 13px;
    font-weight: 550;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item .alias {
    font-size: 11px;
    color: var(--accent);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-top: 2px;
  }
  .no-alias { color: var(--text-dim); }
  .open-count { color: var(--accent); font-weight: 600; font-size: 11px; }
  .item .path {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-top: 1px;
  }
  .item .acts { display: flex; gap: 4px; margin-left: 10px; flex-shrink: 0; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .badge-file { background: rgba(245,158,11,.15); color: var(--accent); }
  .badge-folder { background: rgba(132,204,22,.15); color: var(--green); }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 20px;
    font-size: 12px;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    z-index: 9999;
    animation: slideIn .3s ease;
    max-width: 320px;
  }
  .toast-ok { background: var(--bg); color: var(--green); border: 1px solid var(--green); }
  .toast-err { background: var(--bg); color: var(--red); border: 1px solid var(--red); }
  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .mt10 { margin-top: 10px; }
  .path-row { display: flex; gap: 6px; align-items: stretch; }
  .path-row input { flex: 1; }
  .path-row .btn { white-space: nowrap; flex-shrink: 0; }
  .hidden { display: none !important; }
  .results {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 10px;
    font-size: .72rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .results .line { padding: 3px 0; border-bottom: 1px solid var(--border); }
  .results .line:last-child { border-bottom: none; }
  .ws-card {
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    padding: 10px 12px;
    margin-bottom: 8px;
    transition: border-color .15s;
  }
  .ws-card:hover {
    border-color: var(--border-h);
  }
  .ws-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .ws-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .ws-path {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 8px;
  }
  .ws-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
  }
  .ws-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 4px;
    border-radius: 5px;
    background: var(--surface);
    transition: background .15s;
    cursor: default;
  }
  .ws-cell:hover { background: var(--dsw-hover, rgba(128,128,128,.12)); }
  .ws-icon {
    font-size: 1.1rem;
    line-height: 1;
    margin-bottom: 3px;
  }
  .ws-cell-name {
    font-size: 10.5px;
    color: var(--text-dim);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .ws-more {
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>📁 文件收藏 &amp; 项目创建助手</h1>

<div class="grid">

  <!-- 卡片 1：添加收藏 -->
  <div class="card" id="card-add">
    <h2>🔖 添加收藏</h2>
    <p class="subtitle">收藏常用的文件或文件夹，通过别名快速访问</p>
    <div class="add-form">
      <div class="fg">
        <label for="add-path">文件 / 文件夹路径</label>
        <input type="text" id="add-path" placeholder="C:\Users\me\project 或 /home/me/project">
      </div>
      <div class="row">
        <div class="fg">
          <label for="add-alias">别名（可选）</label>
          <input type="text" id="add-alias" placeholder="我的项目">
        </div>
        <div class="fg">
          <label for="add-type">类型</label>
          <select id="add-type">
            <option value="file">文件</option>
            <option value="folder">文件夹</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="add-btn">➕ 添加收藏</button>
    </div>
    <div class="sort-bar" id="sort-bar">
      <span>排序：</span>
      <button data-sort="openCount" class="active">🔥次数</button>
      <button data-sort="name">📛名称</button>
      <button data-sort="time">🕐时间</button>
    </div>
    <div class="list" id="bookmark-list"></div>
  </div>

  <!-- 创建项目 / 工作区列表 -->
  <div class="card" id="card-project">
    <h2>🚀 创建项目</h2>
    <p class="subtitle">选择类型一键创建，下方展示目标目录中的工作区</p>
    <div class="add-form">
      <div class="fg">
        <label for="project-type">项目类型</label>
        <select id="project-type">
          <optgroup label="基础"><option value="empty">工作区</option></optgroup>
          <optgroup label="项目管理"><option value="project-management">项目管理工程</option></optgroup>
          <optgroup label="代码类工程">
            <option value="code-java">Java 工程</option>
            <option value="code-python">Python 工程</option>
            <option value="code-vue">Vue 工程（npm 创建）</option>
            <option value="code-dsh-plugin">DSH Plugin 工程</option>
          </optgroup>
          <optgroup label="知识类工程"><option value="knowledge">知识类工程</option></optgroup>
          <optgroup label="探索类工程"><option value="exploration">探索类工程</option></optgroup>
          <optgroup label="复制类工程"><option value="copy">复制类工程</option></optgroup>
        </select>
      </div>
      <div class="fg hidden" id="source-wrap">
        <label for="source-path">源工程目录</label>
        <div class="path-row">
          <input type="text" id="source-path" placeholder="C:\projects\source-project">
          <button class="btn btn-s" id="select-source-btn" type="button">📂 选择</button>
        </div>
      </div>
      <div class="fg">
        <label for="project-base">目标目录</label>
        <div class="path-row">
          <input type="text" id="project-base" placeholder="C:\projects 或 /home/me/projects">
          <button class="btn btn-s" id="select-folder-btn" type="button">📂 选择</button>
        </div>
      </div>
      <div class="fg">
        <label for="project-name">项目名称</label>
        <input type="text" id="project-name" placeholder="my-project">
      </div>
      <button class="btn btn-primary" id="create-project-btn" type="button">🚀 创建项目</button>
    </div>
    <div class="sort-bar" id="ws-sort-bar">
      <span>工作区列表：</span>
    </div>
    <div class="list" id="workspace-list"></div>
  </div>

</div>

<script>
(function() {
  try {
    if (window.parent && window.parent !== window) {
      var parentDoc = window.parent.document;
      var parentEl = parentDoc.documentElement;
      var parentTheme = parentEl.getAttribute('data-theme') || parentEl.getAttribute('data-color-mode');
      if (parentTheme === 'dark' || parentTheme === 'light') {
        document.documentElement.setAttribute('data-theme', parentTheme);
      } else {
        var bg = getComputedStyle(parentEl).backgroundColor;
        if (bg) {
          var m = bg.match(/rgba?\((\d+)/);
          if (m && parseInt(m[1]) < 128) document.documentElement.setAttribute('data-theme', 'dark');
        }
      }
    }
  } catch(e) {}

  const API = '/api'

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => {
      switch (c) {
        case '&': return '&amp;'
        case '<': return '&lt;'
        case '>': return '&gt;'
        case '"': return '&quot;'
        case "'": return '&#39;'
        default: return c
      }
    })
  }

  function toast(msg, ok = true) {
    const el = document.createElement('div')
    el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err')
    el.setAttribute('role', ok ? 'status' : 'alert')
    el.setAttribute('aria-live', 'polite')
    el.textContent = msg
    document.body.appendChild(el)
    setTimeout(() => el.remove(), 2800)
  }

  function bookmarkItemHtml(b) {
    const name = b.path.split(/[/\\]/).pop() || b.path
    const alias = b.alias ? escapeHtml(b.alias) : '<span class="no-alias">无别名</span>'
    const count = b.openCount ?? 0
    return `<div class="item" data-action="open" data-alias="${escapeHtml(b.alias)}" title="点击打开: ${escapeHtml(b.path)}">
    <div class="info">
      <div class="name"><span class="badge badge-${b.type}">${b.type}</span> ${escapeHtml(name)}</div>
      <div class="alias">🏷 ${alias}　<span class="open-count">🔥${count}</span></div>
      <div class="path">${escapeHtml(b.path)}</div>
    </div>
    <div class="acts">
      <button class="btn btn-s btn-primary" data-action="open" data-alias="${escapeHtml(b.alias)}">打开</button>
      <button class="btn btn-s btn-danger" data-action="remove" data-alias="${escapeHtml(b.alias)}" aria-label="删除书签">✕</button>
    </div>
  </div>`
  }

  function renderBookmarkList(bookmarks) {
    const container = document.getElementById('bookmark-list')
    if (!bookmarks || bookmarks.length === 0) {
      container.innerHTML = '<div class="empty">还没有收藏项，在上方添加第一个</div>'
      return
    }
    const sorted = sortBookmarks(bookmarks)
    container.innerHTML = sorted.map(bookmarkItemHtml).join('')
  }

  let sortMode = 'openCount'

  function sortBookmarks(list) {
    const arr = [...list]
    switch (sortMode) {
      case 'time':
        return arr.sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime())
      case 'name':
        return arr.sort((a, b) => (a.path.split(/[/\\]/).pop() || '').localeCompare(b.path.split(/[/\\]/).pop() || ''))
      case 'openCount':
      default:
        return arr.sort((a, b) => (b.openCount ?? 0) - (a.openCount ?? 0))
    }
  }

  async function apiGet(path) {
    const res = await fetch(API + path)
    if (!res.ok) throw new Error('HTTP ' + res.status)
    return res.json()
  }
  async function apiPost(path, body) {
    const res = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    return res.json()
  }
  async function apiDelete(path) {
    const res = await fetch(API + path, { method: 'DELETE' })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    return res.json()
  }

  async function refreshAll() {
    try {
      const data = await apiGet('/bookmarks')
      renderBookmarkList(data)
    } catch (e) {
      console.error('刷新书签列表失败:', e)
    }
  }

  document.getElementById('sort-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-sort]')
    if (!btn) return
    sortMode = btn.dataset.sort
    document.querySelectorAll('#sort-bar button').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    apiGet('/bookmarks').then(data => renderBookmarkList(data)).catch(() => {})
  })

  document.getElementById('add-btn').addEventListener('click', async () => {
    const path = document.getElementById('add-path').value.trim()
    const alias = document.getElementById('add-alias').value.trim()
    const type = document.getElementById('add-type').value
    if (!path) { toast('请输入路径', false); return }

    const btn = document.getElementById('add-btn')
    btn.disabled = true
    btn.textContent = '⏳ 添加中...'
    try {
      const data = await apiPost('/bookmarks', { path, alias: alias || undefined, type })
      if (data.success) {
        toast(data.message)
        document.getElementById('add-path').value = ''
        document.getElementById('add-alias').value = ''
      } else {
        toast(data.message, false)
      }
      await refreshAll()
    } catch (e) {
      toast('请求失败: ' + e.message, false)
    } finally {
      btn.disabled = false
      btn.textContent = '➕ 添加收藏'
    }
  })

  async function openBookmark(alias) {
    try {
      const data = await apiPost('/open', { target: alias })
      toast(data.message, data.success)
    } catch (e) { toast('打开失败: ' + e.message, false) }
  }

  async function removeBookmark(alias) {
    try {
      const data = await apiDelete('/bookmarks/' + encodeURIComponent(alias))
      toast(data.message, data.success)
      await refreshAll()
    } catch (e) { toast('删除失败: ' + e.message, false) }
  }

  document.getElementById('bookmark-list').addEventListener('click', onListClick)

  function onListClick(e) {
    const el = e.target.closest('[data-action]')
    if (!el) return
    const action = el.dataset.action
    const alias = el.dataset.alias
    if (!alias) return
    e.stopPropagation()
    if (action === 'open') openBookmark(alias)
    else if (action === 'remove') removeBookmark(alias)
  }

  document.getElementById('select-folder-btn').addEventListener('click', () => selectFolder('project-base'))
  document.getElementById('select-source-btn').addEventListener('click', () => selectFolder('source-path'))
  document.getElementById('project-type').addEventListener('change', () => {
    const type = document.getElementById('project-type').value
    document.getElementById('source-wrap').classList.toggle('hidden', type !== 'copy')
  })
  document.getElementById('project-base').addEventListener('change', loadWorkspaceList)
  document.getElementById('create-project-btn').addEventListener('click', createProject)

  async function selectFolder(targetInputId) {
    try {
      const data = await apiGet('/select-folder')
      if (data.success && data.path) {
        document.getElementById(targetInputId).value = data.path
        toast(data.message)
        if (targetInputId === 'project-base') loadWorkspaceList()
      } else {
        toast(data.message, false)
      }
    } catch (e) { toast('选择文件夹失败: ' + e.message, false) }
  }

  async function loadWorkspaceList() {
    const basePath = document.getElementById('project-base').value.trim()
    const container = document.getElementById('workspace-list')
    const url = basePath ? '/workspaces?path=' + encodeURIComponent(basePath) : '/workspaces'
    try {
      const data = await apiGet(url)
      if (data.success) {
        renderWorkspaceList(data.workspaces)
      } else {
        container.innerHTML = '<div class="empty">加载工作区失败</div>'
      }
    } catch (e) {
      container.innerHTML = '<div class="empty">加载工作区失败: ' + escapeHtml(e.message) + '</div>'
    }
  }

  function renderWorkspaceList(workspaces) {
    const container = document.getElementById('workspace-list')
    if (!workspaces || workspaces.length === 0) {
      container.innerHTML = '<div class="empty">目标目录下暂无工作区</div>'
      return
    }
    container.innerHTML = workspaces.map(ws => workspaceCardHtml(ws)).join('')
  }

  function workspaceCardHtml(ws) {
    const items = ws.items || []
    const dirs = items.filter(i => i.isDirectory).slice(0, 6)
    const files = items.filter(i => !i.isDirectory).slice(0, 4)
    const dirIcons = ['📁', '📂', '🗂', '📦', '🗃', '📑']
    const fileIcons = ['📄', '📝', '📋', '📃']
    const gridHtml = dirs.map((d, idx) => {
      const icon = dirIcons[idx % dirIcons.length]
      return `<div class="ws-cell" title="${escapeHtml(d.name)}">
        <span class="ws-icon">${icon}</span>
        <span class="ws-cell-name">${escapeHtml(d.name)}</span>
      </div>`
    }).join('') + files.map((f, idx) => {
      const icon = fileIcons[idx % fileIcons.length]
      return `<div class="ws-cell" title="${escapeHtml(f.name)}">
        <span class="ws-icon">${icon}</span>
        <span class="ws-cell-name">${escapeHtml(f.name)}</span>
      </div>`
    }).join('')
    const moreCount = items.length - dirs.length - files.length
    const moreHtml = moreCount > 0 ? `<div class="ws-cell ws-more">+${moreCount} 更多</div>` : ''
    return `<div class="ws-card" data-wspath="${escapeHtml(ws.path)}">
      <div class="ws-header">
        <div class="ws-title">🏠 ${escapeHtml(ws.name)}</div>
        <div class="ws-acts">
          <button class="btn btn-s btn-primary" data-ws-open="${escapeHtml(ws.path)}">打开</button>
        </div>
      </div>
      <div class="ws-path">${escapeHtml(ws.path)}</div>
      <div class="ws-grid">${gridHtml}${moreHtml}</div>
    </div>`
  }

  document.getElementById('workspace-list').addEventListener('click', (e) => {
    const openBtn = e.target.closest('[data-ws-open]')
    if (openBtn) {
      const path = openBtn.dataset.wsOpen
      apiPost('/open', { target: path }).then(data => toast(data.message, data.success)).catch(err => toast('打开失败: ' + err.message, false))
    }
  })

  async function createProject() {
    const basePath = document.getElementById('project-base').value.trim()
    const projectName = document.getElementById('project-name').value.trim()
    const projectType = document.getElementById('project-type').value
    const sourcePath = document.getElementById('source-path').value.trim()

    if (!basePath) { toast('请选择或输入目标目录', false); return }
    if (!projectName) { toast('请输入项目名称', false); return }
    if (projectType === 'copy' && !sourcePath) { toast('请输入源工程路径', false); return }

    const btn = document.getElementById('create-project-btn')
    btn.disabled = true
    btn.textContent = '⏳ 创建中...'

    try {
      const data = await apiPost('/create-project', {
        basePath,
        projectName,
        projectType,
        sourcePath: projectType === 'copy' ? sourcePath : undefined,
      })
      toast(data.message, data.success)
      if (data.success) {
        document.getElementById('project-name').value = ''
        loadWorkspaceList()
        try {
          const msg = {
            type: 'dsh-file-bookmark:workspace-created',
            path: data.projectPath,
            title: projectName,
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, '*')
          }
          if (window.top && window.top !== window && window.top !== window.parent) {
            window.top.postMessage(msg, '*')
          }
        } catch (pmErr) {
          console.warn('[dsh-file-bookmark] postMessage 失败', pmErr)
        }
      }
    } catch (e) {
      toast('创建项目失败: ' + e.message, false)
    } finally {
      btn.disabled = false
      btn.textContent = '🚀 创建项目'
    }
  }

  refreshAll()
  loadWorkspaceList()
})();
</script>
</body>
</html>
